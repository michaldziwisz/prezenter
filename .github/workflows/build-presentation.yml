name: Build Presentation

on:
  workflow_dispatch:
    inputs:
      publication_id:
        required: true
        type: string
      source_identifier:
        required: true
        type: string
      source_file:
        required: true
        type: string
      presentation_mode:
        required: false
        default: auto
        type: string
      output_identifier:
        required: true
        type: string
      callback_url:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc unzip python3-pip
          python3 -m venv "$RUNNER_TEMP/ia-venv"
          "$RUNNER_TEMP/ia-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/ia-venv/bin/pip" install internetarchive python-pptx
          echo "$RUNNER_TEMP/ia-venv/bin" >> "$GITHUB_PATH"

      - name: Configure Internet Archive
        run: |
          mkdir -p ~/.config
          cat > ~/.config/ia.ini <<EOF
          [s3]
          access = ${{ secrets.ARCHIVE_ACCESS_KEY }}
          secret = ${{ secrets.ARCHIVE_SECRET_KEY }}
          EOF
          chmod 600 ~/.config/ia.ini

      - name: Detect presentation mode
        id: mode
        run: |
          mode="${{ inputs.presentation_mode }}"
          source_file="${{ inputs.source_file }}"
          lower_source_file="${source_file,,}"
          if [ -z "$mode" ] || [ "$mode" = "auto" ]; then
            case "$lower_source_file" in
              *.pptx)
                mode="pptx"
                ;;
              *)
                mode="markdown"
                ;;
            esac
          fi
          case "$mode" in
            markdown|pptx)
              echo "presentation_mode=$mode" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported presentation mode: $mode" >&2
              exit 1
              ;;
          esac

      - name: Download source bundle
        run: |
          mkdir -p source bundle dist
          source_path="bundle/${{ inputs.source_file }}"
          SOURCE_IDENTIFIER="${{ inputs.source_identifier }}" \
          SOURCE_FILE="${{ inputs.source_file }}" \
          python3 <<'PY'
          import os
          import time
          from pathlib import Path
          from internetarchive import get_item

          identifier = os.environ["SOURCE_IDENTIFIER"]
          source_file = os.environ["SOURCE_FILE"]
          source_path = Path("bundle") / source_file
          attempts = 60

          for attempt in range(1, attempts + 1):
              if source_path.exists():
                  source_path.unlink()
              try:
                  item = get_item(identifier)
                  item.get_file(source_file).download(
                      destdir="bundle",
                      ignore_existing=False,
                      retries=3,
                      timeout=60
                  )
                  if source_path.exists() and source_path.stat().st_size > 0:
                      print(f"Downloaded {source_file} from {identifier}.")
                      break
                  last_error = "downloaded file is missing or empty"
              except Exception as error:
                  last_error = str(error)

              if attempt == attempts:
                  raise SystemExit(
                      f"Source file was not available after {attempts} attempts: "
                      f"{identifier}/{source_file}; last error: {last_error}"
                  )
              print(
                  f"Source file is not available yet; retrying in 10 seconds "
                  f"({attempt}/{attempts}). Last error: {last_error}",
                  flush=True
              )
              time.sleep(10)
          PY
          if [ ! -s "$source_path" ]; then
            echo "Downloaded source file is empty: $source_path" >&2
            exit 1
          fi
          mode="${{ steps.mode.outputs.presentation_mode }}"
          source_file="${{ inputs.source_file }}"
          lower_source_file="${source_file,,}"
          case "$mode:$lower_source_file" in
            markdown:*.zip)
              unzip -q "$source_path" -d source
              ;;
            markdown:*.tar.gz|markdown:*.tgz)
              tar -xzf "$source_path" -C source
              ;;
            markdown:*.tar)
              tar -xf "$source_path" -C source
              ;;
            markdown:*.md)
              cp "$source_path" source/slides.md
              ;;
            pptx:*.pptx)
              cp "$source_path" source/presentation.pptx
              ;;
            pptx:*)
              echo "PPTX mode requires a .pptx source file" >&2
              exit 1
              ;;
            *)
              echo "Unsupported Markdown source file" >&2
              exit 1
              ;;
          esac

      - name: Install PPTX tools
        if: ${{ steps.mode.outputs.presentation_mode == 'pptx' }}
        run: |
          sudo apt-get install -y libreoffice poppler-utils fonts-dejavu fonts-liberation ffmpeg

      - name: Build reveal.js HTML
        if: ${{ steps.mode.outputs.presentation_mode == 'markdown' }}
        run: |
          slides="$(find source -maxdepth 3 -name 'slides.md' -print -quit)"
          if [ -z "$slides" ]; then
            slides="$(find source -maxdepth 3 -name '*.md' -print -quit)"
          fi
          if [ -z "$slides" ]; then
            echo "No Markdown file found" >&2
            exit 1
          fi
          pandoc "$slides" \
            --standalone \
            --to revealjs \
            --embed-resources \
            --resource-path="$(dirname "$slides"):source" \
            -V revealjs-url=https://unpkg.com/reveal.js@5 \
            -V lang=pl \
            -o dist/index.html
          cat > dist/accessibility-report.json <<EOF
          {
            "status": "basic-build-complete",
            "notes": [
              "Pandoc build completed.",
              "Full axe/Playwright checks should be added before public beta."
            ]
          }
          EOF

      - name: Build PPTX share page
        if: ${{ steps.mode.outputs.presentation_mode == 'pptx' }}
        env:
          OUTPUT_IDENTIFIER: ${{ inputs.output_identifier }}
          SOURCE_FILE: ${{ inputs.source_file }}
        run: |
          pptx="source/presentation.pptx"
          if [ ! -s "$pptx" ]; then
            echo "No PPTX source file found" >&2
            exit 1
          fi
          cp "$pptx" dist/presentation.pptx
          pdf_status="unavailable"
          if libreoffice --headless --convert-to pdf --outdir dist "$pptx" && [ -s dist/presentation.pdf ]; then
            pdf_status="created"
            pdftoppm -png -r 144 dist/presentation.pdf dist/slide
          fi
          PDF_STATUS="$pdf_status" python3 <<'PY'
          import json
          import os
          import posixpath
          import shutil
          import subprocess
          import zipfile
          from html import escape
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from pptx import Presentation

          output_identifier = os.environ["OUTPUT_IDENTIFIER"]
          source_file = os.environ["SOURCE_FILE"]
          pdf_available = Path("dist/presentation.pdf").exists()
          pptx_path = Path("source/presentation.pptx")

          def slide_number(path):
              return int(path.stem.rsplit("-", 1)[1])

          slide_images = sorted(Path("dist").glob("slide-*.png"), key=slide_number)
          pdf_status = os.environ.get("PDF_STATUS", "unavailable")

          def text_runs(paragraph):
              text = "".join(run.text for run in paragraph.runs).strip()
              return text or paragraph.text.strip()

          def text_blocks(shape):
              if not getattr(shape, "has_text_frame", False):
                  return []
              blocks = []
              for paragraph in shape.text_frame.paragraphs:
                  text = " ".join(text_runs(paragraph).split())
                  if text:
                      blocks.append({"text": text, "level": paragraph.level})
              return blocks

          def table_block(shape):
              if not getattr(shape, "has_table", False):
                  return None
              rows = []
              for row in shape.table.rows:
                  cells = [" ".join(cell.text.split()) for cell in row.cells]
                  if any(cells):
                      rows.append(cells)
              return {"type": "table", "rows": rows} if rows else None

          def render_table(rows):
              body = "\n".join(
                  "              <tr>" + "".join(f"<td>{escape(cell)}</td>" for cell in row) + "</tr>"
                  for row in rows
              )
              return f'            <table><tbody>\n{body}\n            </tbody></table>'

          AUDIO_EXTENSIONS = {".aac", ".aif", ".aiff", ".flac", ".m4a", ".mp3", ".oga", ".ogg", ".opus", ".wav", ".wma"}
          VIDEO_EXTENSIONS = {".avi", ".m4v", ".mov", ".mp4", ".mpeg", ".mpg", ".ogv", ".webm", ".wmv"}
          MIME_BY_EXT = {
              ".aac": "audio/aac",
              ".m4a": "audio/mp4",
              ".mp3": "audio/mpeg",
              ".oga": "audio/ogg",
              ".ogg": "audio/ogg",
              ".opus": "audio/ogg",
              ".wav": "audio/wav",
              ".mp4": "video/mp4",
              ".m4v": "video/mp4",
              ".ogv": "video/ogg",
              ".webm": "video/webm",
          }

          def clean_text(value):
              return " ".join(str(value or "").split())

          def local_name(tag):
              return tag.rsplit("}", 1)[-1]

          def media_kind(extension):
              if extension in AUDIO_EXTENSIONS:
                  return "audio"
              if extension in VIDEO_EXTENSIONS:
                  return "video"
              return ""

          def media_mime_type(extension, kind):
              return MIME_BY_EXT.get(extension, f"{kind}/{extension.lstrip('.') or 'octet-stream'}")

          def slide_part_path(slide):
              return str(slide.part.partname).lstrip("/")

          def slide_rels_path(slide_path):
              directory, filename = posixpath.split(slide_path)
              return posixpath.join(directory, "_rels", f"{filename}.rels")

          def media_target_path(slide_path, target):
              if not target or target.startswith("/") or "://" in target:
                  return ""
              normalized = posixpath.normpath(posixpath.join(posixpath.dirname(slide_path), target))
              if normalized.startswith("../") or not normalized.startswith("ppt/media/"):
                  return ""
              return normalized

          def element_references_relationship(element, relationship_id):
              for child in element.iter():
                  if relationship_id in child.attrib.values():
                      return True
              return False

          def labels_for_relationship(slide_root, relationship_id, slide_index, media_index, kind):
              kind_label = "Wideo" if kind == "video" else "Audio"
              fallback_title = f"{kind_label} na slajdzie {slide_index}"
              for element in slide_root.iter():
                  if local_name(element.tag) not in {"pic", "sp", "graphicFrame"}:
                      continue
                  if not element_references_relationship(element, relationship_id):
                      continue
                  properties = next((node for node in element.iter() if local_name(node.tag) == "cNvPr"), None)
                  if properties is None:
                      break
                  title = clean_text(properties.attrib.get("title")) or clean_text(properties.attrib.get("name"))
                  description = clean_text(properties.attrib.get("descr"))
                  if title.lower().startswith(("media ", "video ", "audio ", "picture ")):
                      title = ""
                  return {
                      "title": title or fallback_title,
                      "description": description
                  }
              return {
                  "title": f"{fallback_title} {media_index}" if media_index > 1 else fallback_title,
                  "description": ""
              }

          def convert_or_copy_media(package, media_path, slide_index, media_index, kind):
              source_extension = Path(media_path).suffix.lower()
              target_extension = ".mp3" if kind == "audio" else ".mp4"
              target_name = f"slide-{slide_index}-media-{media_index}{target_extension}"
              target_path = Path("dist") / target_name
              source_tmp = Path("dist") / f"_source-slide-{slide_index}-media-{media_index}{source_extension or '.bin'}"
              source_tmp.write_bytes(package.read(media_path))
              converted = False
              conversion_failed = False

              if shutil.which("ffmpeg"):
                  if kind == "audio":
                      command = [
                          "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
                          "-i", str(source_tmp),
                          "-vn", "-codec:a", "libmp3lame", "-q:a", "4",
                          str(target_path)
                      ]
                  else:
                      command = [
                          "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
                          "-i", str(source_tmp),
                          "-map", "0:v:0", "-map", "0:a?",
                          "-c:v", "libx264", "-pix_fmt", "yuv420p",
                          "-c:a", "aac", "-movflags", "+faststart",
                          str(target_path)
                      ]
                  try:
                      subprocess.run(command, check=True, timeout=180)
                      converted = target_path.exists() and target_path.stat().st_size > 0
                  except Exception:
                      conversion_failed = True

              if not converted:
                  fallback_extension = source_extension or target_extension
                  target_name = f"slide-{slide_index}-media-{media_index}{fallback_extension}"
                  target_path = Path("dist") / target_name
                  target_path.write_bytes(source_tmp.read_bytes())
                  target_extension = fallback_extension
                  conversion_failed = True

              try:
                  source_tmp.unlink()
              except FileNotFoundError:
                  pass

              return {
                  "src": f"./{target_name}",
                  "mimeType": media_mime_type(target_extension, kind),
                  "originalPath": media_path,
                  "converted": converted,
                  "conversionFailed": conversion_failed
              }

          def extract_slide_media(package, slide, slide_index):
              slide_path = slide_part_path(slide)
              rels_path = slide_rels_path(slide_path)
              try:
                  rels_root = ET.fromstring(package.read(rels_path))
                  slide_root = ET.fromstring(package.read(slide_path))
              except KeyError:
                  return []

              media = []
              seen_targets = set()
              for relationship in rels_root:
                  relationship_id = relationship.attrib.get("Id", "")
                  target_mode = relationship.attrib.get("TargetMode", "")
                  target = relationship.attrib.get("Target", "")
                  if target_mode.lower() == "external":
                      continue
                  media_path = media_target_path(slide_path, target)
                  extension = Path(media_path).suffix.lower()
                  kind = media_kind(extension)
                  if not media_path or not kind or media_path in seen_targets:
                      continue
                  seen_targets.add(media_path)
                  labels = labels_for_relationship(slide_root, relationship_id, slide_index, len(media) + 1, kind)
                  published = convert_or_copy_media(package, media_path, slide_index, len(media) + 1, kind)
                  media.append({
                      "type": kind,
                      "title": labels["title"],
                      "description": labels["description"],
                      **published
                  })
              return media

          def render_media(media):
              items = []
              for item in media:
                  title = escape(item["title"], quote=True)
                  description = escape(item["description"]) if item["description"] else ""
                  caption = f"<figcaption><strong>{escape(item['title'])}</strong>"
                  if description:
                      caption += f"<br>{description}"
                  caption += "</figcaption>"
                  source = f'<source src="{escape(item["src"], quote=True)}" type="{escape(item["mimeType"], quote=True)}">'
                  if item["type"] == "video":
                      player = f'<video controls preload="metadata" aria-label="{title}">{source}</video>'
                  else:
                      player = f'<audio controls preload="metadata" aria-label="{title}">{source}</audio>'
                  items.append(f'              <figure class="slide-media">{player}{caption}</figure>')
              return "\n".join(items)

          presentation = Presentation(str(pptx_path))
          slide_models = []
          manual_review_slides = []
          media_conversion_failures = []
          media_without_descriptions = []
          with zipfile.ZipFile(pptx_path) as package:
              slide_media_by_index = {
                  index: extract_slide_media(package, slide, index)
                  for index, slide in enumerate(presentation.slides, start=1)
              }
          for index, slide in enumerate(presentation.slides, start=1):
              title_shape = slide.shapes.title
              title = ""
              paragraphs = []
              tables = []
              non_text_shapes = 0
              media = slide_media_by_index.get(index, [])

              for shape in slide.shapes:
                  if getattr(shape, "has_text_frame", False):
                      blocks = text_blocks(shape)
                      if blocks and title_shape is not None and shape == title_shape:
                          title = title or blocks[0]["text"]
                          paragraphs.extend(blocks[1:])
                      elif blocks and not title:
                          title = blocks[0]["text"]
                          paragraphs.extend(blocks[1:])
                      else:
                          paragraphs.extend(blocks)
                  elif getattr(shape, "has_table", False):
                      block = table_block(shape)
                      if block:
                          tables.append(block)
                  else:
                      non_text_shapes += 1

              if not title:
                  title = f"Slajd {index}"
              if non_text_shapes or media:
                  manual_review_slides.append(index)
              media_conversion_failures.extend(index for item in media if item["conversionFailed"])
              media_without_descriptions.extend(index for item in media if not item["description"])
              slide_models.append({
                  "index": index,
                  "title": title,
                  "paragraphs": paragraphs,
                  "tables": tables,
                  "media": media,
                  "nonTextShapes": non_text_shapes
              })

          image_by_index = {slide_number(image): image for image in slide_images}
          slides_payload = {
              "version": 1,
              "format": "pptx",
              "title": output_identifier,
              "sourceFile": source_file,
              "slides": []
          }
          for model in slide_models:
              image = image_by_index.get(model["index"])
              slides_payload["slides"].append({
                  "index": model["index"],
                  "title": model["title"],
                  "image": f"./{image.name}" if image else None,
                  "paragraphs": model["paragraphs"],
                  "tables": model["tables"],
                  "media": model["media"],
                  "nonTextShapes": model["nonTextShapes"]
              })
          Path("dist/slides.json").write_text(
              json.dumps(slides_payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          sections = []
          for model in slide_models:
              index = model["index"]
              image = image_by_index.get(index)
              visual = (
                  f'          <figure class="slide-visual" aria-hidden="true">'
                  f'<img src="./{escape(image.name)}" alt=""></figure>'
                  if image else
                  '          <div class="slide-visual-missing" aria-hidden="true"></div>'
              )
              paragraphs = "\n".join(
                  f'              <p class="indent-{min(block["level"], 4)}">{escape(block["text"])}</p>'
                  for block in model["paragraphs"]
              )
              tables = "\n".join(render_table(block["rows"]) for block in model["tables"])
              media = render_media(model["media"])
              body = "\n".join(part for part in [paragraphs, tables, media] if part)
              if not body:
                  body = '              <p>Brak tekstu możliwego do automatycznego wyciągnięcia z tego slajdu.</p>'
              sections.append(f"""        <section aria-labelledby="slide-title-{index}">
                  <div class="slide-grid">
          {visual}
                    <div class="slide-text">
                      <h2 id="slide-title-{index}">{escape(model["title"])}</h2>
          {body}
                    </div>
                  </div>
                </section>""")

          slide_sections = "\n".join(sections)
          if not slide_sections:
              slide_sections = '        <section><p>Nie udało się wygenerować podglądu slajdów.</p></section>'
          html = f"""<!doctype html>
          <html lang="pl">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>{escape(output_identifier)} - PPTX</title>
              <link rel="stylesheet" href="https://unpkg.com/reveal.js@5/dist/reveal.css">
              <link rel="stylesheet" href="https://unpkg.com/reveal.js@5/dist/theme/white.css">
              <style>
                :root {{
                  color-scheme: light;
                  --accent: #084d3f;
                }}
                * {{ box-sizing: border-box; }}
                a {{ color: var(--accent); font-weight: 700; }}
                a:focus-visible {{ outline: 3px solid #b45309; outline-offset: 3px; }}
                .reveal .slides section {{
                  height: 100%;
                }}
                .slide-grid {{
                  display: grid;
                  grid-template-columns: minmax(0, 2fr) minmax(18rem, 1fr);
                  gap: 1.25rem;
                  align-items: center;
                  width: 100%;
                  height: 100%;
                }}
                .slide-visual {{
                  margin: 0;
                }}
                .slide-visual img {{
                  display: block;
                  max-width: 100%;
                  max-height: 82vh;
                  margin: 0 auto;
                  border: 0;
                  box-shadow: none;
                  object-fit: contain;
                }}
                .slide-text {{
                  max-height: 80vh;
                  overflow: auto;
                  padding: 1rem;
                  border-left: 0.2rem solid var(--accent);
                  background: #ffffff;
                  color: #181a1b;
                  text-align: left;
                  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  font-size: clamp(1rem, 1.8vw, 1.55rem);
                  line-height: 1.45;
                }}
                .slide-text h2 {{
                  margin: 0 0 0.75rem;
                  font-size: 1.25em;
                  line-height: 1.2;
                }}
                .slide-text p {{
                  margin: 0.45rem 0;
                }}
                .slide-text .indent-1 {{ margin-left: 1rem; }}
                .slide-text .indent-2 {{ margin-left: 2rem; }}
                .slide-text .indent-3 {{ margin-left: 3rem; }}
                .slide-text .indent-4 {{ margin-left: 4rem; }}
                .slide-text table {{
                  width: 100%;
                  border-collapse: collapse;
                  font-size: 0.85em;
                }}
                .slide-text td {{
                  border: 1px solid #66717a;
                  padding: 0.35rem;
                }}
                .slide-media {{
                  margin: 1rem 0 0;
                }}
                .slide-media video,
                .slide-media audio {{
                  display: block;
                  width: 100%;
                }}
                .slide-media figcaption {{
                  margin-top: 0.4rem;
                  font-size: 0.8em;
                }}
                @media (max-width: 900px) {{
                  .slide-grid {{
                    grid-template-columns: 1fr;
                    align-content: center;
                  }}
                  .slide-visual img {{
                    max-height: 52vh;
                  }}
                  .slide-text {{
                    max-height: 30vh;
                  }}
                }}
              </style>
            </head>
            <body>
              <div class="reveal">
                <div class="slides">
          {slide_sections}
                </div>
              </div>
              <script src="https://unpkg.com/reveal.js@5/dist/reveal.js"></script>
              <script>
                Reveal.initialize({{
                  hash: true,
                  controls: false,
                  progress: false,
                  transition: "none",
                  backgroundTransition: "none"
                }});
              </script>
            </body>
          </html>
          """
          Path("dist/index.html").write_text(html, encoding="utf-8")
          report = {
              "status": "pptx-share-complete",
              "pdf": pdf_status,
              "slideImages": len(slide_images),
              "textSlides": sum(1 for slide in slide_models if slide["paragraphs"] or slide["tables"]),
              "mediaItems": sum(len(slide["media"]) for slide in slide_models),
              "mediaConversionFailureSlides": sorted(set(media_conversion_failures)),
              "mediaWithoutDescriptionSlides": sorted(set(media_without_descriptions)),
              "manualReviewSlides": sorted(set(manual_review_slides)),
              "notes": [
                  "Original PPTX was published.",
                  "PPTX slides were exported as structured slide data and visual previews." if slide_images else "Slide image preview could not be generated.",
                  "Extracted PPTX text is exposed as semantic HTML next to each visual slide.",
                  "Embedded PPTX audio and video are extracted and rendered as native browser players when present.",
                  "slides.json contains the primary synchronized presentation data for the Prezenter frontend.",
                  "PDF was generated with LibreOffice." if pdf_available else "PDF could not be generated.",
                  "Audio is transcoded to MP3 and video is transcoded to MP4 when possible.",
                  "Slides with images, charts, icons, or other non-text content still require manual accessibility review."
              ]
          }
          Path("dist/accessibility-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Upload build to Internet Archive
        run: |
          mode="${{ steps.mode.outputs.presentation_mode }}"
          if [ "$mode" = "pptx" ]; then
            subject="prezenter;pptx;slides;presentation"
          else
            subject="prezenter;markdown;revealjs;presentation"
          fi
          ia upload "${{ inputs.output_identifier }}" \
            dist/* \
            --metadata "title:${{ inputs.output_identifier }} presentation" \
            --metadata "mediatype:data" \
            --metadata "creator:Prezenter" \
            --metadata "subject:$subject" \
            --retries 3

      - name: Callback success
        if: success()
        run: |
          result_base="${{ inputs.callback_url }}"
          result_base="${result_base%/api/github/callback}"
          RESULT_BASE="$result_base" \
          MODE="${{ steps.mode.outputs.presentation_mode }}" \
          PUBLICATION_ID="${{ inputs.publication_id }}" \
          OUTPUT_IDENTIFIER="${{ inputs.output_identifier }}" \
          python3 > callback-success.json <<'PY'
          import json
          import os

          base = os.environ["RESULT_BASE"].rstrip("/")
          output_identifier = os.environ["OUTPUT_IDENTIFIER"]
          payload = {
              "publicationId": os.environ["PUBLICATION_ID"],
              "status": "published",
              "archiveIdentifier": output_identifier,
              "resultUrl": f"{base}/api/presentations/{output_identifier}/index.html",
              "accessibilityReport": f"{base}/api/presentations/{output_identifier}/accessibility-report.json"
          }
          if os.environ["MODE"] == "pptx":
              payload["slidesUrl"] = f"{base}/api/presentations/{output_identifier}/slides.json"
          print(json.dumps(payload, ensure_ascii=False))
          PY
          curl -fsS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Prezenter-Callback-Secret: ${{ secrets.CALLBACK_SECRET }}" \
            --data @callback-success.json

      - name: Callback failure
        if: failure()
        run: |
          curl -fsS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Prezenter-Callback-Secret: ${{ secrets.CALLBACK_SECRET }}" \
            --data @- <<EOF
          {
            "publicationId": "${{ inputs.publication_id }}",
            "status": "failed"
          }
          EOF
